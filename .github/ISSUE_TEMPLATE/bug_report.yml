name: Bug report
description: Report a problem with Lanterna
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Lanterna version
      placeholder: e.g. 0.4.3
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.0, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions
      options:
        - label: Accessibility granted
        - label: Input Monitoring granted
  - type: textarea
    id: logs
    attributes:
      label: Logs / additional context
      render: shell
