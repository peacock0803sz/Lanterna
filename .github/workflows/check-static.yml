on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  nix-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Validate flake
        run: nix flake check --all-systems
      - name: Check nix formatting
        run: nix develop --command nixfmt --check flake.nix
      # The package only supports Apple Silicon Macs, so building the
      # default output here must fail with the unsupported-system message.
      - name: Assert unsupported-system failure
        run: |
          set +e
          output=$(nix build .#default 2>&1)
          status=$?
          set -e
          echo "$output"
          [[ $status -ne 0 ]]
          echo "$output" | grep -q "only available for aarch64-darwin"

  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      checks: write # for the reviewdog reporters
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          fail_level: any
      - uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          fail_level: any
      # pinact-action v3.0.1 fails to bootstrap pinact via aqua
      # (upstream issue suzuki-shunsuke/pinact-action#1209), so run the
      # official release binary directly with checksum verification.
      # The version matches the pre-commit hook in flake.nix.
      - name: Run pinact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="4.1.1"
          base="https://github.com/suzuki-shunsuke/pinact/releases/download/v${version}"
          curl -fsSL -o /tmp/pinact_linux_amd64.tar.gz "${base}/pinact_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/pinact-checksums.txt "${base}/pinact_${version}_checksums.txt"
          (cd /tmp && grep ' pinact_linux_amd64.tar.gz$' pinact-checksums.txt | sha256sum -c -)
          mkdir -p /tmp/pinact-bin
          tar -xzf /tmp/pinact_linux_amd64.tar.gz -C /tmp/pinact-bin pinact
          /tmp/pinact-bin/pinact run --verify --check

  config-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check schema snapshot
        run: nix develop --command bash scripts/regenerate-config.sh --check
