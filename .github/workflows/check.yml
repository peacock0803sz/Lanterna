on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  nix-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Validate flake
        run: nix flake check --all-systems

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          fail_level: error
      - uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1.34.0
        with:
          fail_level: error
      # pinact-action v3.0.1 fails to bootstrap pinact via aqua
      # (upstream issue suzuki-shunsuke/pinact-action#1209), so run the
      # official release binary directly with checksum verification.
      # The version matches the pre-commit hook in flake.nix.
      - name: Run pinact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="4.1.1"
          base="https://github.com/suzuki-shunsuke/pinact/releases/download/v${version}"
          curl -fsSL -o /tmp/pinact_linux_amd64.tar.gz "${base}/pinact_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/pinact-checksums.txt "${base}/pinact_${version}_checksums.txt"
          (cd /tmp && grep ' pinact_linux_amd64.tar.gz$' pinact-checksums.txt | sha256sum -c -)
          mkdir -p /tmp/pinact-bin
          tar -xzf /tmp/pinact_linux_amd64.tar.gz -C /tmp/pinact-bin pinact
          /tmp/pinact-bin/pinact run --verify --check

  swift-build:
    needs: nix-validate
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 is the preview label for the macOS 27 image;
        # switch to macos-27 once it reaches GA.
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Cache SPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ matrix.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ matrix.os }}-spm-
      # The triple is pinned; CONTRIBUTING.md says why.
      - name: Build
        run: nix develop --command swift build --triple arm64-apple-macosx26.0
      - name: Verify architecture
        run: lipo -archs .build/debug/Lanterna | grep -qx arm64
      - name: Test
        run: nix develop --command swift test --triple arm64-apple-macosx26.0
