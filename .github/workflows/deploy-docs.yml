on:
  push:
    branches: [main, stable]
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Decide whether to deploy
        id: decide
        run: |
          # Direct pushes to main or stable and manual dispatches always
          # deploy. Other branches never trigger this workflow, so
          # unreviewed content cannot reach production.
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ github.event_name }} always deploys" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # workflow_run from release: deploy only when release succeeded
          # and stable just advanced to the released tag.
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=release conclusion was ${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin stable --tags
          HEAD_TAG="${{ github.event.workflow_run.head_branch }}"
          TAG_SHA="$(git rev-parse "${HEAD_TAG}^{commit}" 2>/dev/null || echo unknown)"
          STABLE_SHA="$(git rev-parse origin/stable 2>/dev/null || echo unknown)"
          if [[ "$TAG_SHA" != "unknown" && "$TAG_SHA" == "$STABLE_SHA" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=stable advanced to $HEAD_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=stable ($STABLE_SHA) does not match $HEAD_TAG ($TAG_SHA)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    concurrency:
      group: docs-production
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build versioned docs
        working-directory: ${{ github.workspace }}
        run: bash scripts/build-versioned-docs.sh
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          # main is the Pages production branch. Without --branch, wrangler
          # sends the checked-out branch, so stable pushes become previews.
          command: pages deploy dist --project-name lanterna-docs --branch main
      - name: Purge Cloudflare cache for docs domain
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["lanterna.p3ac0ck.net"]}'
