on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without publishing (skips tag-only steps)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      recover_tag:
        description: 'Published tag to recover the cask for (recovery only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false
  queue: max
  # Keep queued runs instead of replacing them so every tag is processed.

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
