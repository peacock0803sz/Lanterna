name: Vendor C/Migemo

on:
  pull_request:
    paths:
      - Sources/CMigemo/VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  revendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Refresh vendored sources
        run: bash scripts/vendor-cmigemo.sh
      - name: Commit refreshed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sources/CMigemo
          git diff --cached --quiet || git commit -m ":arrow_up: Refresh vendored matching engine sources"
          git push
